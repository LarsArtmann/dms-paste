name: release

# Cuts the GitHub Release for a pushed vX.Y.Z tag from the matching
# CHANGELOG.md section. Fails closed: no section, no Release — a tag can
# never publish notes that were never reviewed in the CHANGELOG. The
# workflow_dispatch dry-run prints the notes a tag WOULD get, without
# creating anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to cut the Release from (e.g. v1.2.0)"
        required: true
        type: string
      dry_run:
        description: "Print the notes instead of creating the Release"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  github-release:
    name: GitHub Release from the CHANGELOG section
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    steps:
      # Always check out the TAG commit, so the section comes from the tree
      # that was actually tagged (not whatever master carries today).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Extract the CHANGELOG section (fail closed without one)
        run: |
          ver="${TAG#v}"
          awk -v ver="$ver" '
            index($0, "## " ver) == 1 { found = 1; next }
            /^## / { if (found) exit }
            found { print }
          ' CHANGELOG.md > section.md
          if [ ! -s section.md ]; then
            echo "release: no \"## ${ver}\" section in the tagged CHANGELOG.md — refusing to cut a Release" >&2
            exit 1
          fi

      - name: Assemble the notes (section + tag-pinned how-to-consume)
        run: |
          cat section.md > notes.md
          printf '\n## How to consume\n\n```nix\n{\n  inputs = {\n    dms-paste.url = "github:LarsArtmann/dms-paste/%s";\n    dankMaterialShell.url = "github:AvengeMedia/DankMaterialShell"; # or your pinned fork/ref\n  };\n\n  # in your home-manager config:\n  imports = [ inputs.dms-paste.homeModules.dms-paste ];\n  programs.dms-paste.enable = true;\n\n  # optional: patch the clipboard modal (compose with your own overrides)\n  programs.dank-material-shell.package =\n    inputs.dms-paste.lib.patchDms pkgs\n      inputs.dankMaterialShell.packages.${'$'}{pkgs.system}.default;\n}\n```\n\nAll settings the module wires are `mkDefault` — override any of them without fighting merge priority. Full documentation: [README](https://github.com/LarsArtmann/dms-paste#dms-paste)\n' "$TAG" >> notes.md

      - name: Dry-run — print the notes, create nothing
        if: env.DRY_RUN == 'true'
        run: |
          echo "=== dry run: release notes for $TAG ==="
          cat notes.md
          echo "=== end of dry run (no Release was created) ==="

      - name: Create the GitHub Release
        if: env.DRY_RUN != 'true'
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
