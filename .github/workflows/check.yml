name: check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions: {}

jobs:
  flake-check:
    name: nix flake check (x86_64-linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      # aarch64-linux is part of the flake's systems list but is not
      # evaluated here: cross-checking needs binfmt/qemu setup and the
      # checks are architecture-independent (eval + text contracts).
      - name: nix flake check
        run: nix flake check
