name: check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions: {}

jobs:
  flake-check:
    name: nix flake check (x86_64-linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      # aarch64-linux is part of the flake's systems list but is not
      # evaluated here: cross-checking needs binfmt/qemu setup and the
      # checks are architecture-independent (eval + text contracts).
      - name: nix flake check
        run: nix flake check
